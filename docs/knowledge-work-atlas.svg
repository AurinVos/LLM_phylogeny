8" cy="352" r="4" fill="#8fbcb0" stroke="none"/><text x="64" y="387" font-size="24" fill="#fff" font-weight="600">Language model</text><text x="64" y="418" font-size="15" fill="#cadad6" >Generate and transform</text><text x="64" y="442" font-size="15" fill="#cadad6" >information in context</text></g><rect x="42" y="639" width="1277" height="61" rx="12" fill="#f2f5f1" stroke="none"/><text x="65" y="676" font-size="18" fill="#20343e" font-weight="650">Human direction</text><text x="292" y="676" font-size="19" fill="#20343e" >Frame the question · judge the evidence · approve the result</text><text x="42" y="737" font-size="15" fill="#627277" >Illustrative combinations—not prerequisites, a sequence, or model ancestry.</text><text x="1319" y="737" font-size="12" fill="#627277" font-weight="600" text-anchor="end" letter-spacing="1.8">LLM ATLAS</text></svg>